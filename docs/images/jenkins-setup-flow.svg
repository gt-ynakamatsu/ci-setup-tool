<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="525" viewBox="0 0 1600 525" font-family="'Yu Gothic', 'YuGothic', 'Meiryo', sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#003894"/></marker></defs>
<rect width="1600" height="525" fill="#ffffff"/>
<rect x="20" y="20" width="250" height="44" rx="0" fill="#595757" stroke="none" stroke-width="2"/>
<text x="145.0" y="50" font-size="22" fill="#ffffff" font-weight="700" text-anchor="middle" xml:space="preserve">確認と準備</text>
<rect x="290" y="20" width="510" height="44" rx="0" fill="#003894" stroke="none" stroke-width="2"/>
<text x="545.0" y="50" font-size="22" fill="#ffffff" font-weight="700" text-anchor="middle" xml:space="preserve">サーバーで実行</text>
<rect x="820" y="20" width="760" height="44" rx="0" fill="#003894" stroke="none" stroke-width="2"/>
<text x="1200.0" y="50" font-size="22" fill="#ffffff" font-weight="700" text-anchor="middle" xml:space="preserve">設定用 PC の CISetup で確認</text>
<rect x="20" y="96" width="250" height="270" rx="0" fill="#eef2f9" stroke="#003894" stroke-width="2"/>
<circle cx="58" cy="134" r="24" fill="#003894"/>
<text x="58" y="142" font-size="22" fill="#ffffff" font-weight="700" text-anchor="middle" xml:space="preserve">1</text>
<text x="94" y="143" font-size="24" fill="#231815" font-weight="700" text-anchor="start" xml:space="preserve">事前確認</text>
<text x="40" y="196" font-size="24" fill="#231815" font-weight="400" text-anchor="start" xml:space="preserve">Jenkins が</text>
<text x="40" y="230" font-size="24" fill="#231815" font-weight="400" text-anchor="start" xml:space="preserve">入っていない</text>
<text x="40" y="264" font-size="24" fill="#231815" font-weight="400" text-anchor="start" xml:space="preserve">ことを確認</text>
<text x="40" y="312" font-size="22" fill="#3c3c3c" font-weight="400" text-anchor="start" xml:space="preserve">「対象」の条件</text>
<polygon points="273,231 287,221 287,241" fill="#595757" transform="rotate(180 280 231)"/>
<rect x="290" y="96" width="245" height="270" rx="0" fill="#eef2f9" stroke="#003894" stroke-width="2"/>
<circle cx="328" cy="134" r="24" fill="#003894"/>
<text x="328" y="142" font-size="22" fill="#ffffff" font-weight="700" text-anchor="middle" xml:space="preserve">2</text>
<text x="364" y="143" font-size="24" fill="#231815" font-weight="700" text-anchor="start" xml:space="preserve">実行</text>
<text x="310" y="196" font-size="24" fill="#231815" font-weight="400" text-anchor="start" xml:space="preserve">管理者</text>
<text x="310" y="230" font-size="24" fill="#231815" font-weight="400" text-anchor="start" xml:space="preserve">PowerShell で</text>
<text x="310" y="264" font-size="24" fill="#231815" font-weight="400" text-anchor="start" xml:space="preserve">スクリプト実行</text>
<text x="310" y="312" font-size="22" fill="#3c3c3c" font-weight="400" text-anchor="start" xml:space="preserve">完了まで待つ</text>
<polygon points="538,231 552,221 552,241" fill="#595757" transform="rotate(180 545 231)"/>
<rect x="555" y="96" width="245" height="270" rx="0" fill="#eef2f9" stroke="#003894" stroke-width="2"/>
<circle cx="593" cy="134" r="24" fill="#003894"/>
<text x="593" y="142" font-size="22" fill="#ffffff" font-weight="700" text-anchor="middle" xml:space="preserve">3</text>
<text x="629" y="143" font-size="24" fill="#231815" font-weight="700" text-anchor="start" xml:space="preserve">完了表示</text>
<text x="575" y="196" font-size="24" fill="#231815" font-weight="400" text-anchor="start" xml:space="preserve">==&gt; 完了 と</text>
<text x="575" y="230" font-size="24" fill="#231815" font-weight="400" text-anchor="start" xml:space="preserve">プラグイン7個</text>
<text x="575" y="264" font-size="24" fill="#231815" font-weight="400" text-anchor="start" xml:space="preserve">を確認</text>
<text x="575" y="312" font-size="22" fill="#3c3c3c" font-weight="400" text-anchor="start" xml:space="preserve">URL・ユーザー・</text>
<text x="575" y="340" font-size="22" fill="#3c3c3c" font-weight="400" text-anchor="start" xml:space="preserve">API Token を控える</text>
<polygon points="803,231 817,221 817,241" fill="#595757" transform="rotate(180 810 231)"/>
<rect x="820" y="96" width="240" height="270" rx="0" fill="#eef2f9" stroke="#003894" stroke-width="2"/>
<circle cx="858" cy="134" r="24" fill="#003894"/>
<text x="858" y="142" font-size="22" fill="#ffffff" font-weight="700" text-anchor="middle" xml:space="preserve">4</text>
<text x="894" y="143" font-size="24" fill="#231815" font-weight="700" text-anchor="start" xml:space="preserve">CISetup</text>
<text x="840" y="196" font-size="24" fill="#231815" font-weight="400" text-anchor="start" xml:space="preserve">⑤ Jenkins への</text>
<text x="840" y="230" font-size="24" fill="#231815" font-weight="400" text-anchor="start" xml:space="preserve">接続 へ入力</text>
<text x="840" y="312" font-size="22" fill="#3c3c3c" font-weight="400" text-anchor="start" xml:space="preserve">設定用 PC で</text>
<text x="840" y="340" font-size="22" fill="#3c3c3c" font-weight="400" text-anchor="start" xml:space="preserve">アイコンから起動</text>
<polygon points="1063,231 1077,221 1077,241" fill="#595757" transform="rotate(180 1070 231)"/>
<rect x="1080" y="96" width="240" height="270" rx="0" fill="#eef2f9" stroke="#003894" stroke-width="2"/>
<circle cx="1118" cy="134" r="24" fill="#003894"/>
<text x="1118" y="142" font-size="22" fill="#ffffff" font-weight="700" text-anchor="middle" xml:space="preserve">5</text>
<text x="1154" y="143" font-size="24" fill="#231815" font-weight="700" text-anchor="start" xml:space="preserve">接続テスト</text>
<text x="1100" y="196" font-size="24" fill="#231815" font-weight="400" text-anchor="start" xml:space="preserve">成功の</text>
<text x="1100" y="230" font-size="24" fill="#231815" font-weight="400" text-anchor="start" xml:space="preserve">メッセージ</text>
<text x="1100" y="264" font-size="24" fill="#231815" font-weight="400" text-anchor="start" xml:space="preserve">を確認</text>
<text x="1100" y="312" font-size="22" fill="#3c3c3c" font-weight="400" text-anchor="start" xml:space="preserve">接続成功</text>
<polygon points="1323,231 1337,221 1337,241" fill="#595757" transform="rotate(180 1330 231)"/>
<rect x="1340" y="96" width="240" height="270" rx="0" fill="#eef2f9" stroke="#003894" stroke-width="2"/>
<circle cx="1378" cy="134" r="24" fill="#003894"/>
<text x="1378" y="142" font-size="22" fill="#ffffff" font-weight="700" text-anchor="middle" xml:space="preserve">6</text>
<text x="1414" y="143" font-size="24" fill="#231815" font-weight="700" text-anchor="start" xml:space="preserve">エージェント</text>
<text x="1360" y="196" font-size="24" fill="#231815" font-weight="400" text-anchor="start" xml:space="preserve">Nodes 画面で</text>
<text x="1360" y="230" font-size="24" fill="#231815" font-weight="400" text-anchor="start" xml:space="preserve">オンライン</text>
<text x="1360" y="264" font-size="24" fill="#231815" font-weight="400" text-anchor="start" xml:space="preserve">を確認</text>
<text x="1360" y="312" font-size="22" fill="#3c3c3c" font-weight="400" text-anchor="start" xml:space="preserve">windows-agent</text>
<rect x="20" y="390" width="1560" height="52" rx="0" fill="#fdeced" stroke="none" stroke-width="2"/>
<rect x="20" y="390" width="8" height="52" rx="0" fill="#e60012" stroke="none" stroke-width="2"/>
<text x="44" y="425" font-size="23" fill="#231815" font-weight="400" text-anchor="start" xml:space="preserve">手順3 の完了表示（または MSI 版の案内）まで PowerShell を閉じない。手順6 の確認が終わるまでサインアウトしない</text>
<rect x="20" y="456" width="1560" height="52" rx="0" fill="#eef2f9" stroke="none" stroke-width="2"/>
<rect x="20" y="456" width="8" height="52" rx="0" fill="#003894" stroke="none" stroke-width="2"/>
<text x="44" y="491" font-size="23" fill="#231815" font-weight="400" text-anchor="start" xml:space="preserve">手順3 のプラグイン確認、手順5 の接続テスト、手順6 のオンライン確認がそろえば、初回セットアップは完了</text>
</svg>
