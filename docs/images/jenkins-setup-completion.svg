<text x="24" y="358" font-size="18" fill="#ffffff" font-weight="400" text-anchor="start" font-family="Consolas, 'BIZ UDGothic', 'MS Gothic', monospace" xml:space="preserve">作業フォルダ: C:\Jenkins\workspace</text>
<text x="24" y="394" font-size="18" fill="#ffffff" font-weight="400" text-anchor="start" font-family="Consolas, 'BIZ UDGothic', 'MS Gothic', monospace" xml:space="preserve">起動スクリプト: C:\jenkins\start-jenkins.bat</text>
<text x="24" y="430" font-size="18" fill="#ffffff" font-weight="400" text-anchor="start" font-family="Consolas, 'BIZ UDGothic', 'MS Gothic', monospace" xml:space="preserve">パスワードの保存先: C:\jenkins\cisetup-admin-password.txt</text>
<text x="24" y="466" font-size="18" fill="#ffffff" font-weight="400" text-anchor="start" font-family="Consolas, 'BIZ UDGothic', 'MS Gothic', monospace" xml:space="preserve">CISetup の「⑤ Jenkins への接続」に Jenkins URL、ユーザー名、API Token を入れ、接続テストが成功すれば使えます。</text>
<text x="24" y="502" font-size="18" fill="#ffffff" font-weight="400" text-anchor="start" font-family="Consolas, 'BIZ UDGothic', 'MS Gothic', monospace" xml:space="preserve">エージェントラベルは空欄にしてください。組み込みノードの実行数は 0 です。</text>
<text x="24" y="538" font-size="18" fill="#9aa7b8" font-weight="400" text-anchor="start" font-family="'Yu Gothic', 'YuGothic', 'Meiryo', sans-serif" xml:space="preserve">（このあと、再起動後の起動、ログの場所、SYSTEM での実行などの案内が4行続く）</text>
<rect x="980" y="66" width="590" height="170" rx="0" fill="#ffffff" stroke="#ffd200" stroke-width="3"/>
<text x="1000" y="104" font-size="23" fill="#231815" font-weight="700" text-anchor="start" font-family="'Yu Gothic', 'YuGothic', 'Meiryo', sans-serif" xml:space="preserve">CISetup「⑤ Jenkins への接続」へ入力</text>
<text x="1020" y="144" font-size="22" fill="#231815" font-weight="400" text-anchor="start" font-family="'Yu Gothic', 'YuGothic', 'Meiryo', sans-serif" xml:space="preserve">1 → Jenkins URL</text>
<text x="1020" y="176" font-size="22" fill="#231815" font-weight="400" text-anchor="start" font-family="'Yu Gothic', 'YuGothic', 'Meiryo', sans-serif" xml:space="preserve">2 → ユーザー名</text>
<text x="1020" y="208" font-size="22" fill="#231815" font-weight="400" text-anchor="start" font-family="'Yu Gothic', 'YuGothic', 'Meiryo', sans-serif" xml:space="preserve">3 → API Token</text>
<text x="360" y="322" font-size="21" fill="#ffd200" font-weight="700" text-anchor="start" font-family="'Yu Gothic', 'YuGothic', 'Meiryo', sans-serif" xml:space="preserve">← Nodes 画面で確認する名前</text>
<text x="880" y="322" font-size="21" fill="#ffd200" font-weight="700" text-anchor="start" font-family="'Yu Gothic', 'YuGothic', 'Meiryo', sans-serif" xml:space="preserve">↑ プラグイン ID が7個あることを確認</text>
